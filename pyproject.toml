[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "faceauth"
version = "1.0.0"
description = "Classical face authentication with LBPH, active liveness, calibrated thresholds, and encrypted biometric storage"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Abishek Luitel"},
]
requires-python = ">=3.10"
keywords = [
    "face-authentication",
    "biometrics",
    "lbph",
    "opencv",
    "liveness-detection",
    "classical-machine-learning",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "opencv-contrib-python==5.0.0.93",
    "numpy>=2.0",
    "scikit-learn>=1.5",
]

[project.urls]
Homepage = "https://github.com/LuiShek/classical-face-authentication"
Repository = "https://github.com/LuiShek/classical-face-authentication"
Issues = "https://github.com/LuiShek/classical-face-authentication/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
faceauth = ["assets/*"]

[project.scripts]
faceauth = "faceauth.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
