name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -c "import faceauth.cli; import sklearn"
          python -m pip install -r requirements.txt

      - name: Run test suite
        shell: pwsh
        run: python -m pytest -q

      - name: Run headless self-test
        shell: pwsh
        run: python -m faceauth.cli selftest
